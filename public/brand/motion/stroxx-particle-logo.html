<script>

(function () {
  var BLUES = ['#2C7FC0', '#1E8FD5', '#0098E8', '#4FA8EE', '#8FC6F4', '#D2E8FC'];
  var MR = 120, MF = 3.0, MAX = 2600;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The real STROXX wordmark (white), inlined so the file is fully portable.
  var LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100.34 28.31"><g fill="#fff">'
    + '<polygon points="21 8.2 24.14 8.2 24.14 22.97 26.86 22.97 26.86 8.2 30 8.2 30 5.89 21 5.89 21 8.2"/>'

  var cv = document.getElementById('stx'), ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
  var P = [], dot = 1.4, mx = -1e5, my = -1e5;

  function size() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    var img = new Image();
    img.onload = function () {
      var OW = 300, OH = Math.round(OW * (28.31 / 100.34));
      var off = document.createElement('canvas'); off.width = OW; off.height = OH;
      var o = off.getContext('2d'); o.drawImage(img, 0, 0, OW, OH);
      var d;
      try { d = o.getImageData(0, 0, OW, OH).data; } catch (e) { return; }
      var cand = [], minX = OW, minY = OH, maxX = 0, maxY = 0, x, y, i, a;
      for (y = 0; y < OH; y += 1) for (x = 0; x < OW; x += 1) {
        i = (y * OW + x) * 4; a = d[i + 3];
        if (a < 40) continue;
        cand.push(x, y);
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      var total = cand.length / 2; if (!total) return;
      var stride = total > MAX ? Math.ceil(total / MAX) : 1;
      var bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
      var scale = Math.min((W * 0.66) / bw, (H * 0.66) / bh);
      var bcx = (minX + maxX) / 2, bcy = (minY + maxY) / 2;
      dot = Math.max(1, scale * 0.4);
      P = [];
      for (var k = 0; k < total; k += stride) {
        var sx = cand[k * 2], sy = cand[k * 2 + 1];
        var tx = W / 2 + (sx - bcx) * scale, ty = H / 2 + (sy - bcy) * scale;
        var free = Math.random() < 0.24;
        P.push({
          x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, tx: tx, ty: ty,
          k: free ? 0.004 : 0.012 + Math.random() * 0.03, dr: 0.80 + Math.random() * 0.1,
          wa: free ? 5 + Math.random() * 10 : 0.3 + Math.random() * 1.4, ws: 0.4 + Math.random() * 1.6,
          wp: Math.random() * 6.28, c: BLUES[Math.min(BLUES.length - 1, Math.floor(Math.random() * BLUES.length))],
          s: 0.7 + Math.random() * 0.5
        });
      }
      if (reduce) { for (var m = 0; m < P.length; m++) { P[m].x = P[m].tx; P[m].y = P[m].ty; } draw(); }
    };
    img.src = 'data:image/svg+xml,' + encodeURIComponent(LOGO);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      ctx.globalAlpha = 0.92; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, dot * p.s, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      var tx = p.tx + Math.cos(t * p.ws + p.wp) * p.wa;
      var ty = p.ty + Math.sin(t * p.ws + p.wp) * p.wa;
      p.vx += (tx - p.x) * p.k; p.vy += (ty - p.y) * p.k;
      var ddx = p.x - mx, ddy = p.y - my, dd = ddx * ddx + ddy * ddy;
      if (dd < MR * MR) { var f = (1 - Math.sqrt(dd) / MR) * MF; var inv = 1 / (Math.sqrt(dd) || 1); p.vx += ddx * inv * f; p.vy += ddy * inv * f; }
      p.vx *= p.dr; p.vy *= p.dr; p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = 0.92; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, dot * p.s, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { size(); build(); });
  cv.addEventListener('pointermove', function (e) { var r = cv.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; });
  cv.addEventListener('pointerleave', function () { mx = -1e5; my = -1e5; });

  size(); build();
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
