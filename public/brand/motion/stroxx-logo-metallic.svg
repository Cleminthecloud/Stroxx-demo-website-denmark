           page's Replay button restart it (same convention as the reveal
           and loop files in this kit). -->
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-220 0; 470 0; 470 0" keyTimes="0; 0.5; 1"
        keySplines="0.33 0 0.2 1; 0 0 1 1" calcMode="spline"
