    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="0.45" stop-color="#8a9096"/>
      <stop offset="0.55" stop-color="#5f656b"/>
      <stop offset="1" stop-color="#c4c9cf"/>
    </linearGradient>
    <linearGradient id="shineBand" gradientUnits="userSpaceOnUse" x1="-40" y1="120" x2="150" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <!-- The light passes over the mark, rests, then passes again. SMIL on
           the gradient keeps the file self-contained and lets the brand
           page's Replay button restart it (same convention as the reveal
           and loop files in this kit). -->
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-220 0; 470 0; 470 0" keyTimes="0; 0.5; 1"
        keySplines="0.33 0 0.2 1; 0 0 1 1" calcMode="spline"
        dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="360" height="120" fill="#0B0C0E"/>
  <!-- 1: knockout body so overlaps read as solid metal -->
  <use href="#mark" fill="#0B0C0E"/>
  <!-- 2: dark steel contour -->
  <use href="#mark" fill="none" stroke="#26282b" stroke-width="1.05" stroke-linejoin="round"/>
  <!-- 3: static brushed-metal body on the contour -->
  <use href="#mark" fill="none" stroke="url(#steel)" stroke-width="0.72" stroke-linejoin="round" opacity="0.55"/>
  <!-- 4: the traveling shine -->
  <use href="#mark" fill="none" stroke="url(#shineBand)" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
